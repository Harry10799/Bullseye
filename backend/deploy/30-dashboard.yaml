# Dashboard Deployment — Next.js UI.
# Run alongside hub + sniffer for a complete in-cluster Bullseye deployment.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bullseye-dashboard
  namespace: bullseye-system
  labels:
    app.kubernetes.io/name: bullseye
    app.kubernetes.io/component: dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bullseye
      app.kubernetes.io/component: dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bullseye
        app.kubernetes.io/component: dashboard
    spec:
      containers:
        - name: dashboard
          image: harikumar15/bulleyes-dashboard:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            # Connect to the in-cluster hub service
            - name: NEXT_PUBLIC_BACKEND
              value: hub
            - name: NEXT_PUBLIC_HUB_WS_URL
              value: ws://bullseye-hub.bullseye-system.svc:3030/
          ports:
            - name: http
              containerPort: 3000
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: 500m, memory: 512Mi }
          livenessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: bullseye-dashboard
  namespace: bullseye-system
  labels:
    app.kubernetes.io/name: bullseye
    app.kubernetes.io/component: dashboard
spec:
  selector:
    app.kubernetes.io/name: bullseye
    app.kubernetes.io/component: dashboard
  ports:
    - name: http
      port: 80
      targetPort: http
