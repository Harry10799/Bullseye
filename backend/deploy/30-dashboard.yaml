# Dashboard Deployment — Next.js UI.
# Run alongside hub + sniffer for a complete in-cluster Bullseye deployment.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bullseye-dashboard
  namespace: bullseye-system
  labels:
    app.kubernetes.io/name: bullseye
    app.kubernetes.io/component: dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bullseye
      app.kubernetes.io/component: dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bullseye
        app.kubernetes.io/component: dashboard
    spec:
      containers:
        - name: dashboard
          image: harikumar15/bulleyes-dashboard:latest
          imagePullPolicy: Always
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            # This value must be reachable by the user's browser. For local
            # access, forward the hub port and keep localhost; for remote
            # access, set the browser-reachable ws:// or wss:// URL.
            - name: NEXT_PUBLIC_BACKEND
              value: hub
            - name: HUB_WS_URL
              value: ws://localhost:3030/
          ports:
            - name: http
              containerPort: 3000
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: 500m, memory: 512Mi }
          livenessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: bullseye-dashboard
  namespace: bullseye-system
  labels:
    app.kubernetes.io/name: bullseye
    app.kubernetes.io/component: dashboard
spec:
  selector:
    app.kubernetes.io/name: bullseye
    app.kubernetes.io/component: dashboard
  ports:
    - name: http
      port: 80
      targetPort: http
